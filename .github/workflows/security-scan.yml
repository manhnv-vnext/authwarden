name: Security Scan (Self-Dogfooding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  authwarden-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AuthWarden Scan
        run: node bin/authwarden.js scan . --format markdown
