<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" fill="none">
  <defs>
    <!-- Multi-stage ambient shadow -->
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Terminal container border gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Header subtle background gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Summary box background gradient -->
    <linearGradient id="summaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Clip path for the window header rounded top corners -->
    <clipPath id="headerClip">
      <rect x="20" y="20" width="900" height="660" rx="14"/>
    </clipPath>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="20" y="20" width="900" height="660" rx="14" fill="#090D16" stroke="url(#termBorder)" stroke-width="1.5" filter="url(#termShadow)"/>

  <!-- Window Header Bar (Clipped to top curves) -->
  <g clip-path="url(#headerClip)">
    <rect x="20" y="20" width="900" height="44" fill="url(#headerGrad)"/>
    <line x1="20" y1="64" x2="920" y2="64" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="46" cy="42" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
  <circle cx="66" cy="42" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
  <circle cx="86" cy="42" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>

  <!-- Centered Window Title -->
  <text x="470" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" font-weight="500" letter-spacing="0.2">
    zsh • npx authwarden scan . --verify
  </text>

  <!-- Terminal Content Area (Symmetrically centered with 48px left margin) -->
  <g transform="translate(48, 86)" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12.5" xml:space="preserve">

    <!-- Interactive Prompt Line -->
    <text x="0" y="14" fill="#10B981" font-weight="700">minno@mac</text>
    <text x="80" y="14" fill="#64748B">:</text>
    <text x="92" y="14" fill="#38BDF8" font-weight="600">~/projects/modern-saas</text>
    <text x="282" y="14" fill="#94A3B8">$</text>
    <text x="298" y="14" fill="#F8FAFC" font-weight="600">npx authwarden scan . --verify</text>

    <!-- ASCII Banner Logo -->
    <text x="0" y="44" fill="#38BDF8" font-weight="700">   ___         __  __    _      __              __          </text>
    <text x="0" y="60" fill="#60A5FA" font-weight="700">  / _ | __ __ / /_/ /_  | | /| / /__ _____ ___ / /__ ___    </text>
    <text x="0" y="76" fill="#818CF8" font-weight="700"> / __ |/ // // __/ _ \  | |/ |/ / _ `/ __// _  / -_) _ \   </text>
    <text x="0" y="92" fill="#C084FC" font-weight="700">/_/ |_|\_,_/ \__/_//_/  |__/|__/\_,_/_/   \_,_/\__/_//_/ v1.0.0</text>

    <!-- Divider 1 -->
    <line x1="0" y1="108" x2="844" y2="108" stroke="#1E293B" stroke-width="1"/>

    <!-- Discovery Summary -->
    <text x="0" y="128" fill="#10B981" font-weight="700">✔</text>
    <text x="18" y="128" fill="#94A3B8">Target: <tspan fill="#F1F5F9" font-weight="600">/projects/modern-saas</tspan></text>

    <text x="0" y="148" fill="#10B981" font-weight="700">✔</text>
    <text x="18" y="148" fill="#94A3B8">Frameworks: <tspan fill="#38BDF8">Next.js App Router</tspan>, <tspan fill="#38BDF8">FastAPI</tspan>, <tspan fill="#38BDF8">OpenAPI</tspan>, <tspan fill="#38BDF8">AI Agent / MCP</tspan></text>

    <text x="0" y="168" fill="#10B981" font-weight="700">✔</text>
    <text x="18" y="168" fill="#94A3B8">Scanned <tspan fill="#F59E0B" font-weight="600">128 files</tspan> in <tspan fill="#10B981" font-weight="700">18ms</tspan> • Active secret verifier: <tspan fill="#10B981" font-weight="700">ONLINE</tspan></text>

    <!-- Divider 2 -->
    <line x1="0" y1="184" x2="844" y2="184" stroke="#1E293B" stroke-width="1"/>

    <!-- Finding 1: Shadow Admin Route (BFLA) -->
    <rect x="0" y="198" width="76" height="19" rx="3" fill="#450A0A" stroke="#DC2626" stroke-width="0.8"/>
    <text x="10" y="212" fill="#FCA5A5" font-size="10.5" font-weight="800">CRITICAL</text>
    <text x="88" y="212" fill="#F87171" font-weight="700">AUTH-001</text>
    <text x="168" y="212" fill="#F1F5F9" font-weight="600">Shadow Admin Route Missing Auth Middleware</text>
    <text x="24" y="230" fill="#64748B">File: <tspan fill="#38BDF8">app/api/admin/users/route.ts:14</tspan></text>
    <text x="24" y="246" fill="#475569">14 | export async function POST(req: NextRequest) {</text>
    <text x="24" y="262" fill="#EF4444">15 |   const users = await db.user.deleteMany(); <tspan fill="#991B1B">// ⚠️ Missing session &amp; role check</tspan></text>

    <!-- Finding 2: Unscoped BOLA/IDOR Query -->
    <rect x="0" y="280" width="54" height="19" rx="3" fill="#431407" stroke="#EA580C" stroke-width="0.8"/>
    <text x="10" y="294" fill="#FDBA74" font-size="10.5" font-weight="800">HIGH</text>
    <text x="66" y="294" fill="#FB923C" font-weight="700">AUTH-003</text>
    <text x="146" y="294" fill="#F1F5F9" font-weight="600">Potential BOLA / IDOR Unscoped Object Query</text>
    <text x="24" y="312" fill="#64748B">File: <tspan fill="#38BDF8">app/api/invoices/[id]/route.ts:8</tspan></text>
    <text x="24" y="328" fill="#F97316">8  | const invoice = await db.invoice.findById(params.id); <tspan fill="#7C2D12">// ⚠️ No tenant ownership filter</tspan></text>

    <!-- Finding 3: Verified Active Stripe Live Secret -->
    <rect x="0" y="346" width="76" height="19" rx="3" fill="#450A0A" stroke="#DC2626" stroke-width="0.8"/>
    <text x="10" y="360" fill="#FCA5A5" font-size="10.5" font-weight="800">CRITICAL</text>
    <text x="88" y="360" fill="#F87171" font-weight="700">SEC-004</text>
    <text x="160" y="360" fill="#F1F5F9" font-weight="600">Exposed Stripe Live Secret Key</text>
    <rect x="390" y="347" width="138" height="17" rx="3" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
    <text x="398" y="359" fill="#6EE7B7" font-size="10" font-weight="700">● LIVE VERIFIED (200 OK)</text>
    <text x="24" y="378" fill="#64748B">File: <tspan fill="#38BDF8">.env.production:4</tspan></text>
    <text x="24" y="394" fill="#EF4444">4  | STRIPE_SECRET_KEY=sk_live_51M************************</text>

    <!-- Finding 4: Business Logic Payment Bypass -->
    <rect x="0" y="412" width="54" height="19" rx="3" fill="#431407" stroke="#EA580C" stroke-width="0.8"/>
    <text x="10" y="426" fill="#FDBA74" font-size="10.5" font-weight="800">HIGH</text>
    <text x="66" y="426" fill="#FB923C" font-weight="700">LOGIC-001</text>
    <text x="156" y="426" fill="#F1F5F9" font-weight="600">Payment Status Evasion via Client Payload</text>
    <text x="24" y="444" fill="#64748B">File: <tspan fill="#38BDF8">src/controllers/checkout.js:29</tspan></text>
    <text x="24" y="460" fill="#F97316">29 | if (req.body.is_paid) { await markOrderCompleted(orderId); }</text>

    <!-- Divider 3 -->
    <line x1="0" y1="482" x2="844" y2="482" stroke="#1E293B" stroke-width="1"/>

    <!-- Bottom Result Summary Pill Box -->
    <rect x="0" y="498" width="844" height="38" rx="6" fill="url(#summaryGrad)" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="517" r="5" fill="#EF4444"/>
    <text x="38" y="521" fill="#F1F5F9" font-weight="600" font-size="12">
      Scan completed with <tspan fill="#EF4444" font-weight="700">2 Critical</tspan>, <tspan fill="#FB923C" font-weight="700">2 High</tspan> vulnerabilities in <tspan fill="#38BDF8" font-weight="700">18ms</tspan> • Exit code: 1
    </text>
    <rect x="686" y="506" width="144" height="22" rx="4" fill="#0F172A" stroke="#475569" stroke-width="0.8"/>
    <text x="702" y="521" fill="#94A3B8" font-size="11" font-weight="600">SARIF Exported ✔</text>
  </g>
</svg>
