<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" fill="none">
  <defs>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="20" y="20" width="880" height="600" rx="12" fill="#0B0F19" stroke="url(#termBorder)" stroke-width="1.5" filter="url(#termShadow)"/>

  <!-- Window Header Bar -->
  <path d="M20 32 Q20 20 32 20 L888 20 Q900 20 900 32 L900 56 L20 56 Z" fill="#131B2E"/>
  <line x1="20" y1="56" x2="900" y2="56" stroke="#1E293B" stroke-width="1"/>

  <!-- macOS Window Buttons -->
  <circle cx="44" cy="38" r="6" fill="#EF4444"/>
  <circle cx="64" cy="38" r="6" fill="#F59E0B"/>
  <circle cx="84" cy="38" r="6" fill="#10B981"/>

  <!-- Window Title -->
  <text x="460" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12" fill="#94A3B8" font-weight="500">
    zsh • npx authwarden scan . (420ms)
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(45, 84)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" line-height="1.5">
    
    <!-- Command Prompt -->
    <text x="0" y="0" fill="#10B981" font-weight="700">➜</text>
    <text x="20" y="0" fill="#38BDF8" font-weight="600">~/projects/modern-saas</text>
    <text x="205" y="0" fill="#E2E8F0">authwarden scan . --verify</text>

    <!-- ASCII Logo & Header -->
    <text x="0" y="28" fill="#06B6D4" font-weight="700">   ___         __  __    _      __              __          </text>
    <text x="0" y="44" fill="#3B82F6" font-weight="700">  / _ | __ __ / /_/ /_  | | /| / /__ _____ ___ / /__ ___    </text>
    <text x="0" y="60" fill="#8B5CF6" font-weight="700"> / __ |/ // // __/ _ \  | |/ |/ / _ `/ __// _  / -_) _ \   </text>
    <text x="0" y="76" fill="#EC4899" font-weight="700">/_/ |_|\_,_/ \__/_//_/  |__/|__/\_,_/_/   \_,_/\__/_//_/ v1.0</text>

    <text x="0" y="104" fill="#64748B">─── Discovery &amp; Target Mapping ───────────────────────────────────────────</text>
    <text x="0" y="126" fill="#10B981">✔</text>
    <text x="18" y="126" fill="#E2E8F0">Identified Frameworks: <tspan fill="#38BDF8">Next.js App Router</tspan>, <tspan fill="#38BDF8">FastAPI</tspan>, <tspan fill="#38BDF8">Docker</tspan></text>
    <text x="0" y="146" fill="#10B981">✔</text>
    <text x="18" y="146" fill="#E2E8F0">Indexed <tspan fill="#F59E0B">432 files</tspan> • <tspan fill="#F59E0B">38 API routes</tspan> • Active secret verifier: <tspan fill="#10B981">ENABLED</tspan></text>

    <text x="0" y="174" fill="#64748B">─── Security Findings (3 Critical / High, 1 Medium) ──────────────────────</text>

    <!-- Finding 1: Missing Auth on Admin Route -->
    <rect x="0" y="188" width="82" height="20" rx="4" fill="#991B1B"/>
    <text x="8" y="202" fill="#FEE2E2" font-size="11" font-weight="700">CRITICAL</text>
    <text x="96" y="202" fill="#F87171" font-weight="700">AUTH-001</text>
    <text x="175" y="202" fill="#F1F5F9" font-weight="600">Shadow Admin Route Missing Auth Middleware</text>
    <text x="18" y="222" fill="#94A3B8">Location: <tspan fill="#38BDF8">app/api/admin/users/export/route.ts:14</tspan></text>
    <text x="18" y="240" fill="#64748B">14 | export async function POST(req: NextRequest) {</text>
    <text x="18" y="256" fill="#EF4444">15 |   const allUsers = await db.user.findMany(); // ⚠️ No session or role check</text>

    <!-- Finding 2: Potential BOLA / IDOR -->
    <rect x="0" y="278" width="62" height="20" rx="4" fill="#9A3412"/>
    <text x="8" y="292" fill="#FFEDD5" font-size="11" font-weight="700">HIGH</text>
    <text x="76" y="292" fill="#FB923C" font-weight="700">AUTH-003</text>
    <text x="155" y="292" fill="#F1F5F9" font-weight="600">Unscoped IDOR / BOLA Query by Identifier</text>
    <text x="18" y="312" fill="#94A3B8">Location: <tspan fill="#38BDF8">src/routes/documents.py:42</tspan></text>
    <text x="18" y="330" fill="#64748B">42 | @router.get("/documents/{doc_id}")</text>
    <text x="18" y="346" fill="#F97316">43 | def get_doc(doc_id: int): return db.query(Doc).filter_by(id=doc_id).first()</text>

    <!-- Finding 3: Verified Stripe Key -->
    <rect x="0" y="368" width="82" height="20" rx="4" fill="#991B1B"/>
    <text x="8" y="382" fill="#FEE2E2" font-size="11" font-weight="700">CRITICAL</text>
    <text x="96" y="382" fill="#F87171" font-weight="700">SEC-004</text>
    <text x="165" y="382" fill="#F1F5F9" font-weight="600">Live Verified Stripe Secret Key in Repository</text>
    <text x="18" y="402" fill="#94A3B8">Location: <tspan fill="#38BDF8">.env.production:3</tspan> • <tspan fill="#10B981">Verified Active via Stripe API (200 OK)</tspan></text>
    <text x="18" y="420" fill="#EF4444">3  | STRIPE_SECRET_KEY=sk_live_51M************************</text>

    <!-- Finding 4: Docker Root -->
    <rect x="0" y="442" width="72" height="20" rx="4" fill="#854D0E"/>
    <text x="8" y="456" fill="#FEF08A" font-size="11" font-weight="700">MEDIUM</text>
    <text x="86" y="456" fill="#FACC15" font-weight="700">IAC-001</text>
    <text x="155" y="456" fill="#F1F5F9" font-weight="600">Container Runs as Default Root User</text>
    <text x="18" y="476" fill="#94A3B8">Location: <tspan fill="#38BDF8">Dockerfile:1</tspan> • Missing `USER nonroot` directive</text>

    <!-- Summary Box -->
    <rect x="0" y="494" width="830" height="30" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="514" fill="#F1F5F9" font-weight="600">
      Scan complete in <tspan fill="#38BDF8">420ms</tspan> • <tspan fill="#EF4444">2 Critical</tspan> • <tspan fill="#F97316">1 High</tspan> • <tspan fill="#FACC15">1 Medium</tspan> • Run <tspan fill="#10B981">authwarden fix</tspan> to apply patches
    </text>
  </g>
</svg>
