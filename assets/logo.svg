<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <path d="M60 10 L102 26 C102 70 60 106 60 106 C60 106 18 70 18 26 Z" 
        fill="url(#shieldGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Outer Shield Border -->
  <path d="M60 12 L98 27 C98 68 60 102 60 102 C60 102 22 68 22 27 Z" 
        stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round" fill="#0B0F19"/>

  <!-- Circuit / Radar Grid Lines -->
  <path d="M60 22 L60 48 M60 72 L60 92 M36 40 L50 48 M84 40 L70 48 M36 78 L50 72 M84 78 L70 72" 
        stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="60" cy="60" r="22" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Central Keyhole / Cyber Core -->
  <circle cx="60" cy="54" r="8" fill="url(#coreGrad)"/>
  <path d="M56 58 L53 72 L67 72 L64 58 Z" fill="url(#coreGrad)"/>
  <circle cx="60" cy="54" r="3" fill="#FFFFFF"/>

  <!-- Scanning Ray -->
  <line x1="30" y1="46" x2="90" y2="46" stroke="#06B6D4" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
</svg>
