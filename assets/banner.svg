<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#0EA5E9" opacity="0.15" filter="url(#glowBanner)"/>
  <circle cx="1050" cy="320" r="220" fill="#8B5CF6" opacity="0.18" filter="url(#glowBanner)"/>
  <circle cx="600" cy="200" r="140" fill="#EC4899" opacity="0.08" filter="url(#glowBanner)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#titleGrad)"/>

  <!-- Left Shield Icon (Emblem) -->
  <g transform="translate(100, 110) scale(1.65)">
    <!-- Outer Shield Border -->
    <path d="M60 12 L98 27 C98 68 60 102 60 102 C60 102 22 68 22 27 Z" 
          stroke="url(#titleGrad)" stroke-width="3.5" stroke-linejoin="round" fill="#090E1A"/>
    <!-- Radar Lines -->
    <path d="M60 22 L60 48 M60 72 L60 92 M36 40 L50 48 M84 40 L70 48 M36 78 L50 72 M84 78 L70 72" 
          stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="60" cy="60" r="22" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <!-- Keyhole Core -->
    <circle cx="60" cy="54" r="8" fill="#F59E0B"/>
    <path d="M56 58 L53 72 L67 72 L64 58 Z" fill="#F59E0B"/>
    <circle cx="60" cy="54" r="3" fill="#FFFFFF"/>
    <!-- Scan Line -->
    <line x1="30" y1="46" x2="90" y2="46" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: Product Name & Tagline -->
  <g transform="translate(320, 150)">
    <!-- Pill Badge -->
    <rect x="0" y="-38" width="220" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="-25" r="4" fill="#10B981"/>
    <text x="24" y="-20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">ZERO CONFIG • ZERO DEPS</text>

    <!-- Main Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">AuthWarden</text>
    
    <!-- Subtitle -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">
      Lightning-fast API &amp; Authorization Security Scanner
    </text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      Catch Shadow APIs, BOLA/IDOR, Missing Auth &amp; Leaked Keys in under 1 second.
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 136)">
      <!-- Tag 1: Next.js & Server Actions -->
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#111827" stroke="#374151"/>
      <text x="14" y="20" font-family="monospace" font-size="12" fill="#E2E8F0">⚡ Next.js / FastAPI</text>

      <!-- Tag 2: BOLA / IDOR Detection -->
      <rect x="175" y="0" width="165" height="30" rx="6" fill="#111827" stroke="#374151"/>
      <text x="189" y="20" font-family="monospace" font-size="12" fill="#F59E0B">🎯 IDOR &amp; BFLA Audit</text>

      <!-- Tag 3: Verified Secrets -->
      <rect x="355" y="0" width="150" height="30" rx="6" fill="#111827" stroke="#374151"/>
      <text x="369" y="20" font-family="monospace" font-size="12" fill="#10B981">🔑 Verified Secrets</text>

      <!-- Tag 4: AI & MCP Auditing -->
      <rect x="520" y="0" width="145" height="30" rx="6" fill="#111827" stroke="#374151"/>
      <text x="534" y="20" font-family="monospace" font-size="12" fill="#A855F7">🤖 MCP Agent Guard</text>
    </g>
  </g>

  <!-- Right Decorative Code Bracket Elements -->
  <g transform="translate(1040, 160)" opacity="0.25">
    <text font-family="monospace" font-size="90" font-weight="300" fill="#38BDF8">&gt; /}</text>
  </g>
</svg>
